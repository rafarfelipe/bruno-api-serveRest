info:
  name: Login Cliente
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/login"
  body:
    type: json
    data: |-
      {
        "email": "{{emailCliente}}",
        "password": "teste123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const token = res.body.authorization.replace("Bearer ", "");
        bru.setVar("tokenCliente", token);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.authorization
      operator: contains
      value: Bearer

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
