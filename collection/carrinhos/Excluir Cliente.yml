info:
  name: Excluir Cliente
  type: http
  seq: 9

http:
  method: DELETE
  url: "{{baseUrl}}/usuarios/{{clienteId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.message
      operator: eq
      value: Registro excluído com sucesso

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
