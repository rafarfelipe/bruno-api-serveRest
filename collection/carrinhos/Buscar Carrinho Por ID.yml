info:
  name: Buscar Carrinho Por ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/carrinhos/{{carrinhoId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Carrinho pertence ao usuario que criou", () => {
          expect(res.body.idUsuario).to.equal(bru.getVar("usuarioId"));
        })
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
