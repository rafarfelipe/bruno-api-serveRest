info:
  name: Listar Usuarios
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/usuarios"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.quantidade
      operator: isDefined
    - expression: res.body.usuarios
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
