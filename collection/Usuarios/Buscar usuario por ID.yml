info:
  name: Buscar usuario por ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/usuarios/{{usuarioId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("E-mail retornado é o usuario criada", () => {
          expect(res.body.email).to.equal(bru.getVar("emailGerado"));
        })
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
