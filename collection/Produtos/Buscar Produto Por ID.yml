info:
  name: Buscar Produto Por ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/produtos/{{produtoId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Nome do produto está correto", () => {
          expect(res.body.nome).to.equal(bru.getVar("produtoNome"));
        })
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.preco
      operator: eq
      value: "470"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
