info:
  name: Excluir Produto
  type: http
  seq: 7

http:
  method: DELETE
  url: "{{baseUrl}}/produtos/{{produtoId}}"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.message
      operator: eq
      value: Registro excluído com sucesso

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
