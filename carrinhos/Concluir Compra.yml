info:
  name: Concluir Compra
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/carrinhos/concluir-compra"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.message
      operator: eq
      value: Registro excluído com sucesso

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
